name: Fetch Browser Logs

on:
  push:
    branches:
      - main

permissions:
  contents: read
  # If your script will create issues or comment on PRs based on the logs, 
  # you can keep `issues: write` or `pull-requests: write` here.

jobs:
  run-browser-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Run fetch-logs script
        uses: actions/github-script@v7
        with:
          script: |
            const path = require('path');
            const { pathToFileURL } = require('url');

            const filePath = path.resolve('./scripts/fetch-logs.mjs');
            const fileUrl = pathToFileURL(filePath).href;

            const importedModule = await import(fileUrl);
            await importedModule.default({ github, context });